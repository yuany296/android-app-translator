name: Release APK

# 打一个 v 开头的标签（如 v1.0.0）推上来，或者在本页手动点「Run workflow」，
# GitHub 就会自己在云端编译 APK，并挂到 Release 页面供下载。本地不需要做任何事。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例：v1.0.1；不写 v 也会自动补）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 Android SDK 许可
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 把 Gradle 分发源换成官方地址
        # 仓库里配的是腾讯云镜像（在国内拉得快）；GitHub 的机器在国外，走官方源更稳。
        run: sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties

      - name: 去掉本机专用的 JDK 路径
        # gradle.properties 里写死了本机 Android Studio 的绝对路径，GitHub 的机器上没有这个目录。
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: 让 gradlew 可执行
        run: chmod +x gradlew

      - name: 编译 release 安装包
        # 只打 arm64（真机架构），安装包比带模拟器架构小一半。
        run: ./gradlew :app:assembleRelease -PtargetAbis=arm64-v8a --no-daemon --stacktrace

      - name: 收集产物
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} out/ \;
          ls -la out/

      - name: 发布到 Release 页面
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          case "$VERSION" in
            v*) ;;
            *) VERSION="v$VERSION" ;;
          esac
          mv out/*.apk "out/manga-translator-${VERSION}.apk"
          gh release create "$VERSION" out/*.apk \
            --title "$VERSION" \
            --generate-notes
