<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Webtoon Fixture</title>
  <style>
    html, body { margin: 0; padding: 0; background: #1b1b1b; }
    .reader { width: 100%; max-width: 1080px; margin: 0 auto; }
    .hint {
      box-sizing: border-box;
      padding: 14px 18px;
      color: #f2f2f2;
      font: 16px/1.5 sans-serif;
      background: #2a2a2a;
    }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main class="reader">
    <div class="hint">로컬 웹툰 픽스처 — 스크롤해서 세 패널을 확인하세요.</div>
    <img id="comic-page" src="comic_page.png" alt="세 개의 패널과 한국어 말풍선이 있는 로컬 테스트 만화 페이지">
  </main>
</body>
</html>
