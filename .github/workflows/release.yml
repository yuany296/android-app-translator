name: Release APK

# 打一个 v 开头的标签（如 v1.0.0）推上来，或在本页手动点「Run workflow」并填版本号，
# GitHub 就会自己在云端编译安装包并挂到 Release 页面。本地不需要做任何事。
# 版本号会自动从标签推导并写进 APK（v1.0.1 → 版本名 1.0.1 / 版本号 10001）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例：v1.0.1；不写 v 也会自动补）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 装 Android SDK
        # 必须是 v4：v3 要装的 SDK "tools" 包已被 Google 下架，会在这一步直接失败。
        uses: android-actions/setup-android@v4

      - name: 接受 Android SDK 许可
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 把 Gradle 分发源与依赖源换成官方地址
        # 仓库里配的是国内镜像（腾讯云 + 阿里云，本机拉得快）；GitHub 的机器在国外，
        # 直连官方源更稳，也不会因为镜像同步不全而找不到依赖。
        run: |
          sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties
          sed -i '/maven.aliyun.com/d' settings.gradle.kts

      - name: 去掉本机专用的 JDK 路径
        # gradle.properties 里写死了本机 Android Studio 的绝对路径，GitHub 的机器上没有这个目录。
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: 让 gradlew 可执行
        run: chmod +x gradlew

      - name: 从标签推导版本号
        id: ver
        run: |
          set -e
          V="${{ github.event.inputs.version || github.ref_name }}"
          V="${V#v}"
          MAJOR=$(echo "$V" | cut -d. -f1)
          MINOR=$(echo "$V" | cut -d. -f2); MINOR=${MINOR:-0}
          PATCH=$(echo "$V" | cut -d. -f3); PATCH=${PATCH:-0}
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "本次发布：版本名 $V / 版本号 $CODE"

      - name: 编译 release 安装包
        # 只打 arm64（真机架构），安装包比带模拟器架构小一半。
        # 显式给足内存：默认堆对 5 个模块的 Compose 工程偏小，编译期容易 OOM。
        # 失败时把关键行做成 annotation，方便在本地直接把原因读出来。
        run: |
          set +e
          ./gradlew :app:assembleRelease --no-daemon \
            -PtargetAbis=arm64-v8a \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${{ steps.ver.outputs.code }}" \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --stacktrace > build.log 2>&1
          RC=$?
          tail -60 build.log
          if [ $RC -ne 0 ]; then
            SUMMARY=$(grep -E 'FAILURE:|What went wrong|Could not (resolve|download|find)|OutOfMemory|^Caused by|^e: ' build.log | head -6 | tr '\n' ' | ')
            echo "::error title=Gradle 构建失败::$SUMMARY"
            exit $RC
          fi

      - name: 收集产物
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} out/ \;
          ls -la out/

      - name: 发布到 Release 页面
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="v${{ steps.ver.outputs.name }}"
          mv out/*.apk "out/manga-translator-${VERSION}.apk"
          gh release create "$VERSION" out/*.apk \
            --title "$VERSION" \
            --generate-notes
